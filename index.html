 <!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedido de Namoro 💖</title>

<style>
    body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: linear-gradient(120deg, #ff9a9e, #fad0c4);
        text-align: center;
        color: white;
    }

    h1 {
        margin-top: 80px;
        font-size: 2em;
        padding: 0 20px;
    }

    .botoes {
        position: relative;
        margin-top: 50px;
        height: 300px;
    }

    button {
        padding: 15px 25px;
        font-size: 18px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        position: absolute;
    }

    .sim {
        background-color: #ff4d6d;
        color: white;
        left: 50%;
        transform: translateX(-50%);
        bottom: 20px;
    }

    .nao {
        background-color: #555;
        color: white;
        top: 50px;
        left: 50%;
        transform: translateX(-50%);
    }

    /* Corações */
    .coracao {
        position: absolute;
        bottom: -20px;
        font-size: 20px;
        animation: subir 5s linear infinite;
    }

    @keyframes subir {
        0% {
            transform: translateY(0) scale(1);
            opacity: 1;
        }
        100% {
            transform: translateY(-800px) scale(1.5);
            opacity: 0;
        }
    }
</style>
</head>

<body>

<h1>Quer namorar comigo? 💖</h1>

<div class="botoes" id="area">
    <button class="sim" onclick="clicouSim()">SIM 💘</button>
    <button class="nao" id="naoBtn">NÃO 😢</button>
</div>

<script>
    function clicouNao() {
        alert("Como é a História Vai clicar no sim agora 😋");
    }

    function clicouSim() {
        alert("Parabéns agora sim vc clicou certo, te amo kk ❤😋");
    }

    const naoBtn = document.getElementById("naoBtn");
    const area = document.getElementById("area");

    // Função para mover o botão
    function fugir() {
        const areaRect = area.getBoundingClientRect();

        const maxX = areaRect.width - naoBtn.offsetWidth;
        const maxY = areaRect.height - naoBtn.offsetHeight;

        const randomX = Math.random() * maxX;
        const randomY = Math.random() * maxY;

        naoBtn.style.left = randomX + "px";
        naoBtn.style.top = randomY + "px";
    }

    // Funciona com toque (mobile)
    naoBtn.addEventListener("touchstart", fugir);

    // Caso consiga clicar mesmo assim
    naoBtn.addEventListener("click", clicouNao);

    // Corações animados
    function criarCoracao() {
        const coracao = document.createElement("div");
        coracao.classList.add("coracao");
        coracao.innerHTML = "💖";

        coracao.style.left = Math.random() * 100 + "vw";
        coracao.style.fontSize = (Math.random() * 20 + 10) + "px";
        coracao.style.animationDuration = (Math.random() * 3 + 3) + "s";

        document.body.appendChild(coracao);

        setTimeout(() => {
            coracao.remove();
        }, 5000);
    }

    setInterval(criarCoracao, 300);
</script>

</body>
</html>
